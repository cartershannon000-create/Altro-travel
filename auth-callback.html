<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Altro Auth Callback</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f9fbf7;
        --card: #ffffff;
        --text: #2f3e2c;
        --muted: #6f7c84;
        --border: rgba(47, 62, 44, 0.12);
        --accent: #2f3e2c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #eef3ec 0%, var(--bg) 58%);
        color: var(--text);
      }

      .card {
        width: min(100%, 420px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: 0 18px 48px rgba(47, 62, 44, 0.08);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.1;
        font-weight: 600;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        font-size: 15px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 0 18px;
      }

      .button.primary {
        background: var(--accent);
        color: #fff;
      }

      .button.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Open Altro</h1>
      <p id="status">Finishing your sign-in and sending you back to the app.</p>
      <div class="actions">
        <a id="open-app" class="button primary" href="altro://reset-password">Open the app</a>
        <a class="button secondary" href="https://cartershannon000-create.github.io/Altro-travel/marketing.html">Go to Altro</a>
      </div>
    </main>
    <script>
      (function () {
        var query = window.location.search || "";
        var hash = window.location.hash || "";
        var target = "altro://reset-password" + query + hash;
        var openApp = document.getElementById("open-app");
        var status = document.getElementById("status");

        if (openApp) openApp.href = target;
        if (status && (!query && !hash)) {
          status.textContent = "No recovery token was found. You can return to Altro below.";
        }

        if (query || hash) {
          window.location.replace(target);
        }
      })();
    </script>
  </body>
</html>
